name: CI

# Checks only. Builds and tests run on the developers' machines, Linux natively and Windows with MSVC under Wine, and
# so do releases (docs/ci.md). The build legs that ran here (linux-gcc, windows-msvc and older ones) are in this file's
# history.

on:
  push:
    branches: [main, 'cloud/**', 'claude/**']
  pull_request:
    branches: [main]

# The checks only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job runs one group of tools/checks.sh, which tools/premerge.sh runs whole before a merge.

  # A server's client changes are a plugin (docs/plugins.md): the client's own sources must not name NMS outside
  # comments.
  core-names:
    name: no server code in the client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check src/, sdk/ and ui/
        run: tools/checks.sh core-names

  # The layer order (docs/plan.md "Architecture") and the path::string() calls: their lists of old exceptions only
  # shrink (tools/data/layer_exceptions.txt, path_string_counts.txt).
  layers:
    name: layers and path strings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check src/
        run: tools/checks.sh layers

  # The wiki is built from docs/ (docs/wiki.md): every document has a page and no link points at a missing file, and
  # every entry of docs/unknowns.md has its tag.
  wiki:
    name: docs build into the wiki
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check docs/, CONTRIBUTING.md and server/README.md
        run: tools/checks.sh wiki

  # The shared UI contract's generated files are fresh, and the UI, add-on and release tools pass their tests.
  ui-api:
    name: shared UI contract artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the UI contract and the packers
        run: tools/checks.sh ui-api
